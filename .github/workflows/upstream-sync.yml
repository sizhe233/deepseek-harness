name: Upstream sync
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'sizhe233/deepseek-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node workbench/upstream-sync.mjs
        env:
          GH_TOKEN: ${{ github.token }}
